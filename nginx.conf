server {
    listen 1918;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the .gz files the build produced. They are compressed harder than
    # anything nginx would manage per request, and cost no CPU to serve.
    gzip_static on;

    # Fallback for anything not precompressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/x-yaml
        text/yaml;

    # Hashed filenames, so these can never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # The entry point and the config are the two files that must be allowed to
    # change. They revalidate on every load, which is a 304 on a LAN and keeps
    # a mounted config.yaml editable without rebuilding the image.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /config.yaml {
        add_header Cache-Control "no-cache";
        types { } default_type application/x-yaml;
        # Never serve a baked-in .gz here: this file is meant to be replaced by
        # a volume mount, and a stale precompressed copy would win.
        gzip_static off;
    }

    location / {
        access_log off;
        # SPA Routing: fallback to index.html if file doesn't exist
        try_files $uri $uri/ /index.html;
    }
}
