<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <script>
      // Request the config while the document is still parsing, so it arrives
      // in parallel with the module bundle rather than a round trip after it.
      // A <link rel="preload" as="fetch"> is the usual trick here, but its CORS
      // cache key has to match the fetch() exactly or the file is pulled twice;
      // owning the request outright avoids guessing.
      var config = fetch('/config.yaml').then(function (response) {
        if (!response.ok) throw new Error('Failed to load config.yaml')
        return response.text()
      })
      // Nothing awaits this until the app mounts; keep an early failure from
      // being reported as an unhandled rejection without swallowing it.
      config.catch(function () {})
      window.__bordusConfig = config
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
